name: Check code 

on: 
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.17'
    
      - name: Run ESLint
        run: npx eslint . --ext .js

      - name: HTMLHint
        run: npx htmlhint "**/*.html"

      - name: Stylelint
        run: npx stylelint "**/*.css"

      - name: Prettier
        run: npx prettier --check "**/*.{html,css,js}"