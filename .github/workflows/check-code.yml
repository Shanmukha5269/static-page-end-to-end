name: Check code

on:
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.17'

      - name: Install linters
        run: npm install -g htmlhint stylelint stylelint-config-standard eslint @eslint/js prettier
      
      - name: Run HTML linting
        run: htmlhint "src/**/*.html"
      
      - name: Run CSS linting
        run: stylelint "src/**/*.css"
      
      - name: Run JavaScript linting
        run: eslint "src/**/*.js"
      
      - name: Run Prettier
        run: npm install -g prettier && prettier --check "**/*.{html,css,js}"