name: Check code

on:
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.17'

      - name: Install linters
        run: npm install -g htmlhint stylelint stylelint-config-standard eslint @eslint/js prettier

      - name: Create Stylelint config
        run: |
          cat > stylelint.config.mjs <<'EOF'
          export default {
            extends: ["stylelint-config-standard"]
          };
          EOF

      - name: Create ESLint config
        run: |
          cat > eslint.config.js <<'EOF'
          import js from "@eslint/js";

          export default [
            js.configs.recommended,
            {
              languageOptions: {
                globals: {
                  console: "readonly",
                  document: "readonly",
                  window: "readonly"
                }
              }
            }
          ];
          EOF

      - name: Run HTML linting
        run: htmlhint "src/**/*.html"

      - name: Run CSS linting
        run: stylelint "src/**/*.css"

      - name: Run JavaScript linting
        run: eslint "src/**/*.js"

      - name: Run Prettier
        run: prettier --check "**/*.{html,css,js}"